name: "Nix tests"
on:
  pull_request:
  push:
jobs:
  nix-tests:
    name: nix-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asan: true
          - os: macos-15
            asan: true
          # ASan is broken on macOS 26 due to an upstream LLVM/compiler-rt bug:
          # https://github.com/llvm/llvm-project/issues/200447
          # This entry keeps coverage of the current macOS without sanitizer
          # instrumentation. Once the bug is fixed and released, set asan: true
          # here and drop the macos-15 entry.
          - os: macos-latest
            asan: false
    runs-on: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # - uses: cachix/cachix-action@v15
      #  with:
      #    name: epsteinlib
      #    # If you chose signing key for write access
      #    signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
      #    # If you chose API tokens for write access OR if you have a private cache
      #    authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build
      - run: nix run
      - run: nix build .#epsteinlib_dbg
      - run: nix run .#epsteinlib_dbg
      - run: nix flake check
      - run: nix develop -c tests
      - run: nix develop -c docs
